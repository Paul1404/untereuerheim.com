name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
      - run: bun test
      - name: Build the production image
        run: docker build --tag untereuerheim-smoke .
      - name: Start the production image with origin protection
        run: >-
          docker run --detach --name untereuerheim-smoke
          --publish 127.0.0.1:4321:4321
          --env ORIGIN_AUTH_SECRET=isolated-smoke-test-secret
          untereuerheim-smoke
      - name: Wait for container readiness
        run: >-
          curl --fail --retry 20 --retry-delay 1 --retry-connrefused
          --retry-max-time 30 http://127.0.0.1:4321/health.json
      - name: Verify production pages, assets and access protection
        env:
          SMOKE_ORIGIN_SECRET: isolated-smoke-test-secret
        run: bun run test:smoke -- http://127.0.0.1:4321
      - name: Container diagnostics and cleanup
        if: always()
        run: |
          docker logs untereuerheim-smoke || true
          docker rm --force untereuerheim-smoke || true
